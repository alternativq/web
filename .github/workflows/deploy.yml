name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.yandex
          push: true
          tags: cr.yandex/crplgktfkcdsrtriaqie/veilora-web:latest

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC CLI
        run: |
          echo '${{ secrets.YC_SA_JSON_KEY }}' > sa-key.json
          ~/yandex-cloud/bin/yc config set service-account-key sa-key.json
          rm sa-key.json

      - name: Deploy new revision to Serverless Container
        run: |
          ~/yandex-cloud/bin/yc serverless container revision deploy \
            --container-id bba7rc6keu68dert6hgh \
            --image cr.yandex/crplgktfkcdsrtriaqie/veilora-web:latest \
            --cores 1 \
            --memory 4GB \
            --execution-timeout 15s \
            --concurrency 1 \
            --core-fraction 100
